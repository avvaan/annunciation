{% load i18n %}
<a class="tile" href="{% url 'ministries:ministry_detail' slug=m.slug %}">
  <div class="tile__media">
    <img src="{% if m.image %}{{ m.image.url }}{% else %}/static/images/photos/greenery.jpg{% endif %}"
         alt="" loading="lazy">
  </div>
  <h3>{{ m.name }}{% if m.is_private %} {% include "_icons.html" with icon="lock" %}{% endif %}</h3>
  <p>{{ m.description|truncatewords:18 }}</p>
</a>
